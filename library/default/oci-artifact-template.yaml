apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: ratifyociartifactverification
spec:
  crd:
    spec:
      names:
        kind: RatifyOCIArtifactVerification
      validation:
        openAPIV3Schema:
          type: object
          properties: {}
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package ratifyociartifactverification

        # Get OCI artifacts from ConfigMap data.artifactPath
        remote_data := response {
          # Only check ConfigMaps with data.artifactPath field
          input.review.object.kind == "ConfigMap"
          oci_path := input.review.object.data.artifactPath
          oci_path != null
          oci_path != ""
          
          # Convert single path to array for consistency
          oci_paths := [oci_path]
          response := external_data({"provider": "ratify-provider", "keys": oci_paths})
        }

        # Base Gatekeeper violation
        violation[{"msg": msg}] {
          general_violation[{"result": msg}]
        }

        # Check if there are any system errors
        general_violation[{"result": result}] {
          err := remote_data.system_error
          err != ""
          result := sprintf("System error calling external data provider: %s", [err])
        }

        # Check if there are errors for any of the images
        general_violation[{"result": result}] {
          count(remote_data.errors) > 0
          result := sprintf("Error validating one or more images: %s", remote_data.errors)
        }

        # Check if the success criteria is true
        general_violation[{"result": result}] {
          subject_validation := remote_data.responses[_]
          subject_validation[1].isSuccess == false
          result := sprintf("Time=%s, failed to verify the artifact: %s, trace-id: %s", [subject_validation[1].timestamp, subject_validation[0], subject_validation[1].traceID])
        }